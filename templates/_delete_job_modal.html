<div class="fixed inset-0 z-50 bg-slate-900/30 backdrop-blur-[1px] flex items-center justify-center p-4"
     onclick="if (event.target === this) closeModal()">
  <div class="card w-full max-w-md shadow-modal" role="dialog" aria-modal="true" aria-label="Konfirmasi hapus job">
    <div class="p-5">
      <div class="flex items-start gap-3.5">
        <span class="w-10 h-10 rounded-full bg-danger-bg text-danger flex items-center justify-center shrink-0">
          <i data-lucide="trash-2" class="w-5 h-5"></i>
        </span>
        <div>
          <h2 class="text-[16px] font-semibold text-ink">Hapus Job #{{ '%04d' % job.id }}?</h2>
          <p class="mt-1.5 text-[13px] text-muted leading-relaxed">
            Semua cabang dan transaksi job ini ikut terhapus (CASCADE). File Excel yang sudah diunduh tidak terpengaruh.
          </p>
        </div>
      </div>
      <div class="flex items-center justify-end gap-2.5 mt-5">
        <button type="button" onclick="closeModal()" class="btn-secondary">Batal</button>
        <form hx-post="/jobs/{{ job.id }}/delete" hx-swap="none">
          <input type="hidden" name="csrf_token" value="{{ csrf }}">
          <button type="submit" class="btn bg-danger hover:bg-red-700 text-white"><i data-lucide="trash-2" class="w-4 h-4"></i> Hapus job</button>
        </form>
      </div>
    </div>
  </div>
</div>
