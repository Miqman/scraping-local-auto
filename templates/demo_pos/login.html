<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · DemoPOS</title>
  <style>
    :root { --teal: #0d9488; --ink: #134e4a; --line: #ccfbf1; }
    * { box-sizing: border-box; margin: 0; }
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; min-height: 100vh;
           display: flex; align-items: center; justify-content: center;
           background: linear-gradient(135deg, #f0fdfa 0%, #ecfeff 55%, #f0f9ff 100%); color: #0f172a; }
    .card { width: min(92vw, 380px); background: #fff; border: 1px solid var(--line);
            border-radius: 14px; padding: 32px; box-shadow: 0 8px 24px rgba(13, 148, 136, .08); }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
    .mark { width: 34px; height: 34px; border-radius: 9px; background: var(--teal); color: #fff;
            display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
    h1 { font-size: 17px; color: var(--ink); }
    .sub { font-size: 12px; color: #64748b; }
    label { display: block; font-size: 12px; font-weight: 600; margin: 16px 0 6px; }
    input { width: 100%; height: 38px; padding: 0 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; }
    input:focus { outline: 2px solid rgba(13, 148, 136, .35); border-color: var(--teal); }
    button { margin-top: 22px; width: 100%; height: 40px; border: 0; border-radius: 8px;
             background: var(--teal); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
    button:hover { background: #0f766e; }
    .login-error { margin-top: 16px; padding: 10px 12px; border-radius: 8px; background: #fef2f2;
                   border: 1px solid #fecaca; color: #b91c1c; font-size: 13px; }
    .hint { margin-top: 18px; font-size: 11px; color: #94a3b8; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="mark">D</div>
      <div><h1>DemoPOS</h1><div class="sub">Point of Sale · portal merchant</div></div>
    </div>
    <form method="post" action="/demo-pos/login">
      <label for="u">Username</label>
      <input id="u" name="username" type="text" autocomplete="off" required>
      <label for="p">Password</label>
      <input id="p" name="password" type="password" required>
      <button type="submit">Masuk</button>
    </form>
    {% if error %}<div class="login-error">{{ error }}</div>{% endif %}
    <div class="hint">Situs POS lokal untuk uji end-to-end scraping (bukan POS sungguhan).</div>
  </div>
</body>
</html>
