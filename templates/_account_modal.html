<div class="fixed inset-0 z-50 bg-slate-900/30 backdrop-blur-[1px] flex items-center justify-center p-4"
     onclick="if (event.target === this) closeModal()">
  <div class="card w-full max-w-md shadow-modal" role="dialog" aria-modal="true" aria-label="Form akun merchant">
    <div class="flex items-center justify-between px-5 py-4 border-b border-hairline">
      <h2 class="text-[16px] font-semibold text-ink">{{ 'Edit Akun' if account else 'Tambah Akun' }}</h2>
      <button type="button" onclick="closeModal()" class="p-1.5 rounded-control text-muted hover:bg-hairline-subtle cursor-pointer" aria-label="Tutup">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>
    <form hx-post="/accounts" hx-swap="none" method="post" action="/accounts" class="p-5 space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf }}">
      {% if account %}<input type="hidden" name="id" value="{{ account.id }}">{% endif %}
      <div>
        <label class="block text-xs font-semibold text-ink mb-1.5" for="acc-pos">POS</label>
        <div class="relative">
          <select id="acc-pos" name="pos_code" class="control w-full pl-3 pr-8 appearance-none cursor-pointer" {% if account %}disabled{% endif %}>
            {% for p in pos_list %}
            <option value="{{ p.code }}" {% if p.code == pos_code %}selected{% endif %}>
              {{ p.name }}{% if not p.available %} ({{ p.milestone }}){% endif %}
            </option>
            {% endfor %}
          </select>
          <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-muted absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
        </div>
        {% if account %}<input type="hidden" name="pos_code" value="{{ account.pos_code }}">{% endif %}
      </div>
      <div>
        <label class="block text-xs font-semibold text-ink mb-1.5" for="acc-label">Label merchant</label>
        <input id="acc-label" name="label" type="text" required placeholder="mis. Toko Berkah Jaya"
          value="{{ account.label if account else '' }}" class="control w-full px-3">
      </div>
      <div>
        <label class="block text-xs font-semibold text-ink mb-1.5" for="acc-user">Username</label>
        <input id="acc-user" name="username" type="text" required autocomplete="off"
          value="{{ account.username if account else '' }}" class="control w-full px-3 font-mono text-[13px]">
      </div>
      <div>
        <label class="block text-xs font-semibold text-ink mb-1.5" for="acc-pass">Password</label>
        <input id="acc-pass" name="password" type="password" autocomplete="new-password"
          {% if not account %}required{% endif %}
          placeholder="{{ 'Kosongkan untuk mempertahankan password lama' if account else 'Password akun POS' }}"
          class="control w-full px-3">
        <p class="mt-1.5 text-[11px] text-subtle leading-snug flex items-center gap-1.5">
          <i data-lucide="lock" class="w-3 h-3 shrink-0"></i>
          Write-only: terenkripsi AES-256-GCM, tidak pernah ditampilkan ulang.
        </p>
      </div>
      <div class="flex items-center justify-end gap-2.5 pt-1">
        <button type="button" onclick="closeModal()" class="btn-secondary">Batal</button>
        <button type="submit" class="btn-primary"><i data-lucide="check" class="w-4 h-4"></i> Simpan</button>
      </div>
    </form>
  </div>
</div>
